name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Byte-compile (catch syntax errors)
        run: python -m compileall -q backend tests tools
      - name: Run test suite
        run: python -m unittest discover -s tests -q
      - name: Smoking-import protocol + engine modules
        run: python -c "from backend.protocols.iprint import IPrintProtocol; from backend.services.print_engine import PrintEngine; print(IPrintProtocol.energy_for_density(8), IPrintProtocol.feed_chunks(250))"
